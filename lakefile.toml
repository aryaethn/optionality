name = "optionality"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Optionality"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Optionality"
roots = ["Optionality"]
globs = ["Optionality", "Optionality.+"]
